# External Secrets Operator (ESO)
# Sincroniza o segredo gerenciado do RDS no AWS Secrets Manager para o Secret Kubernetes,
# montando as URLs PostgreSQL com urlquery na senha (evita quebra com caracteres especiais).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: solidarytech
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: solidarytech-db-credentials
  namespace: solidarytech
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: solidarytech-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NGO_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@solidarytech-dev-postgres.c8n6caw4w53y.us-east-1.rds.amazonaws.com:5432/ngo_db?sslmode=require"
        DONATION_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@solidarytech-dev-postgres.c8n6caw4w53y.us-east-1.rds.amazonaws.com:5432/donation_db?sslmode=require"
        POSTGRES_ADMIN_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@solidarytech-dev-postgres.c8n6caw4w53y.us-east-1.rds.amazonaws.com:5432/postgres?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:665303623973:secret:rds!db-7fde4eb7-d7e7-4e1f-bced-a18db86cee19-LcCDDB
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:665303623973:secret:rds!db-7fde4eb7-d7e7-4e1f-bced-a18db86cee19-LcCDDB
        property: password
