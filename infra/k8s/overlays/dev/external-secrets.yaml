# External Secrets Operator (ESO)
# Sincroniza o segredo gerenciado do RDS no AWS Secrets Manager para o Secret Kubernetes,
# montando as URLs PostgreSQL com urlquery na senha (evita quebra com caracteres especiais).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: solidarytech
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: solidarytech-db-credentials
  namespace: solidarytech
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: solidarytech-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Substitua <RDS_ADDRESS> pelo output `rds_endpoint` (sem :5432) do Terragrunt
        NGO_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@<RDS_ADDRESS>:5432/ngo_db?sslmode=require"
        DONATION_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@<RDS_ADDRESS>:5432/donation_db?sslmode=require"
        POSTGRES_ADMIN_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@<RDS_ADDRESS>:5432/postgres?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        # Substitua <RDS_SECRET_ARN> pelo output `rds_secret_arn` do Terragrunt
        key: <RDS_SECRET_ARN>
        property: username
    - secretKey: password
      remoteRef:
        key: <RDS_SECRET_ARN>
        property: password
