# External Secrets Operator (ESO)
# 1. SecretStore para AWS Secrets Manager (credenciais do RDS)
# 2. SecretStore para AWS SSM Parameter Store (URLs/endpoints dinâmicos em /solidarytech/dev/*)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: solidarytech
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-parameter-store
  namespace: solidarytech
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
# Combina username/password do Secrets Manager + rds_address do SSM Parameter Store
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: solidarytech-db-credentials
  namespace: solidarytech
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: solidarytech-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NGO_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@{{ .rds_address }}:5432/ngo_db?sslmode=require"
        DONATION_DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@{{ .rds_address }}:5432/donation_db?sslmode=require"
        POSTGRES_ADMIN_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@{{ .rds_address }}:5432/postgres?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:665303623973:secret:rds!db-7fde4eb7-d7e7-4e1f-bced-a18db86cee19-LcCDDB
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:665303623973:secret:rds!db-7fde4eb7-d7e7-4e1f-bced-a18db86cee19-LcCDDB
        property: password
    - secretKey: rds_address
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: SecretStore
      remoteRef:
        key: /solidarytech/dev/rds_address
---
# Sincroniza URLs/endpoints de runtime diretamente do AWS SSM Parameter Store
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: solidarytech-runtime-config
  namespace: solidarytech
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: solidarytech-runtime-config
    creationPolicy: Owner
  data:
    - secretKey: AWS_SQS_URL
      remoteRef:
        key: /solidarytech/dev/sqs_queue_url
    - secretKey: AWS_DYNAMODB_TABLE
      remoteRef:
        key: /solidarytech/dev/dynamodb_table
    - secretKey: AWS_DYNAMODB_NGO_INDEX
      remoteRef:
        key: /solidarytech/dev/dynamodb_ngo_index
    - secretKey: ELASTICACHE_ENDPOINT
      remoteRef:
        key: /solidarytech/dev/elasticache_endpoint
