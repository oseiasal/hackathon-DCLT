name: 🔍 CI — Quality & DevSecOps (Monorepo)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      ngo: ${{ steps.filter.outputs.ngo }}
      donation: ${{ steps.filter.outputs.donation }}
      volunteer: ${{ steps.filter.outputs.volunteer }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ngo:
              - 'ngo-service/**'
            donation:
              - 'donation-service/**'
            volunteer:
              - 'volunteer-service/**'
            infra:
              - 'infra/**'

  ngo-quality:
    name: 🐍 NGO Service — Quality
    needs: changes
    if: needs.changes.outputs.ngo == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-python-quality.yml@main
    with:
      python-version: '3.11'
      working-directory: 'ngo-service'

  ngo-security:
    name: 🛡️ NGO Service — SAST & SCA
    needs: changes
    if: needs.changes.outputs.ngo == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      working-directory: 'ngo-service'
      enable-iac-scan: false
      trivy-severity: 'CRITICAL'
      fail-on-critical: true

  volunteer-quality:
    name: 🐍 Volunteer Service — Quality
    needs: changes
    if: needs.changes.outputs.volunteer == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-python-quality.yml@main
    with:
      python-version: '3.11'
      working-directory: 'volunteer-service'

  volunteer-security:
    name: 🛡️ Volunteer Service — SAST & SCA
    needs: changes
    if: needs.changes.outputs.volunteer == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      working-directory: 'volunteer-service'
      enable-iac-scan: false
      trivy-severity: 'CRITICAL'
      fail-on-critical: true

  donation-quality:
    name: 🐹 Donation Service — Quality
    needs: changes
    if: needs.changes.outputs.donation == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.21'
      working-directory: 'donation-service'

  donation-security:
    name: 🛡️ Donation Service — SAST & SCA
    needs: changes
    if: needs.changes.outputs.donation == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.21'
      working-directory: 'donation-service'
      enable-iac-scan: false
      trivy-severity: 'CRITICAL'
      fail-on-critical: true

  iac-security:
    name: 🏗️ Infra (Terraform & K8s) — Trivy IaC Scan
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'iac'
      working-directory: 'infra'
      enable-iac-scan: true
      trivy-severity: 'CRITICAL'
      fail-on-critical: true
