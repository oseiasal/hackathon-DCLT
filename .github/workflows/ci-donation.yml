name: 🐹 CI — Donation Service

on:
  pull_request:
    branches: [main]
    paths:
      - 'donation-service/**'
  push:
    branches: [main, 'feat/**']
    paths:
      - 'donation-service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality & Unit Tests
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.21'
      working-directory: 'donation-service'

  security:
    name: SAST (Gosec) & SCA (Trivy)
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.21'
      working-directory: 'donation-service'
      enable-iac-scan: false
      trivy-severity: 'CRITICAL'
      fail-on-critical: true
